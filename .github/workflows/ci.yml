name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, tipos, tests y build
    runs-on: ubuntu-latest

    # Valores ficticios: CI no se conecta a Supabase ni envía correos. Solo se
    # necesitan para que el código que lee variables al importarse no falle.
    env:
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci-only-secret-ci-only-secret-1234
      DATABASE_URL: postgresql://user:password@localhost:5432/hometable
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ci-site-key

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Generar tipos de rutas
        run: pnpm exec next typegen

      - name: Comprobar tipos
        run: pnpm exec tsc --noEmit

      - name: Tests
        run: pnpm test

      - name: Build de producción
        run: pnpm build
